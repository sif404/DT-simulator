<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AXN Digital Twin</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Geist:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#080d16;--s1:#111b29;--s2:#172438;--fg:#f3f6fa;--mu:#96a5b8;--ac:#ce1126;--ok:#38d996;--wn:#f5b942;--cr:#f05b65;--off:#4a5568;--ln:#ffffff18;--g1:#0d1826;--g2:#1a2a40;--pit:#1b6b44;--glow:#1f3f66;color-scheme:dark}
[data-theme=light]{--bg:#e9edf2;--s1:#fff;--s2:#f1f4f8;--fg:#0b1320;--mu:#5a6678;--ok:#0b8a5a;--wn:#b87400;--cr:#c4263a;--off:#9aa4b2;--ln:#0b132026;--g1:#cfd8e3;--g2:#b8c5d6;--pit:#3a9a68;--glow:#bdd0e8;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Geist,"IBM Plex Sans Arabic",system-ui,sans-serif;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
html[lang=ar] body{font-family:"IBM Plex Sans Arabic",Geist,sans-serif}button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 20px}
.brand{display:flex;gap:12px;align-items:center}.mk{width:42px;height:42px;border-radius:12px;background:var(--ac);display:grid;place-items:center;font:700 12px Geist;color:#fff;letter-spacing:.06em}
h1{font:700 18px "Bricolage Grotesque",Geist,sans-serif;margin:0;letter-spacing:-.02em}.brand p{margin:0;color:var(--mu);font-size:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.chip,.tb{border:1px solid var(--ln);background:var(--s1);border-radius:99px;padding:5px 12px;font-size:12.5px;display:inline-flex;gap:7px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.stage{position:relative;height:min(70vh,640px);min-height:380px;margin:0 12px;border-radius:24px;overflow:hidden;background:radial-gradient(60% 70% at 50% 45%,var(--glow),var(--bg) 78%);border:1px solid var(--ln);touch-action:none;cursor:grab}
.stage.em{border-color:var(--cr)}#map{width:100%;height:100%;direction:ltr;display:block}
.hud{position:absolute;inset:14px auto auto 14px;display:flex;gap:18px;flex-wrap:wrap;pointer-events:none;max-width:calc(100% - 300px)}
[dir=rtl] .hud{inset:14px 14px auto auto}.st small{display:block;color:var(--mu);font-size:11.5px}.st b{font:600 26px "Bricolage Grotesque",Geist;letter-spacing:-.03em}.st b i{font:500 12px Geist;color:var(--mu);font-style:normal}
.sel{position:absolute;inset:14px 14px auto auto;width:250px;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--s1) 92%,transparent);border:1px solid var(--ln);font-size:13px}
[dir=rtl] .sel{inset:14px auto auto 14px}.sel h3{margin:0 0 6px;font:600 16px "Bricolage Grotesque",Geist}
.cam{position:absolute;inset:auto 14px 14px auto;display:flex;gap:6px}[dir=rtl] .cam{inset:auto auto 14px 14px}.cam button{width:36px;height:36px;border-radius:10px;border:1px solid var(--ln);background:var(--s1)}.cam .rv{width:auto;padding:0 12px;font-size:12px}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.grid{display:grid;grid-template-columns:1fr 1.2fr 1.2fr;gap:12px;padding:12px}
.card{background:var(--s1);border-radius:18px;padding:16px;border:1px solid var(--ln)}.card h2{font:600 15px "Bricolage Grotesque",Geist;margin:0 0 10px}
.bs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.btn{border:1px solid var(--ln);background:var(--s2);border-radius:99px;padding:6px 12px;font-size:12.5px}.btn.on{background:var(--fg);color:var(--bg)}.btn.cr{color:var(--cr)}.btn.cr.on{background:var(--cr);color:#fff}.btn.go{background:var(--ok);color:#04140d;border:0;font-weight:600}
.mu{color:var(--mu);font-size:12px}.gr{display:grid;grid-template-columns:30px 1fr 64px 70px 50px;gap:8px;align-items:center;width:100%;text-align:start;padding:7px 8px;border-radius:12px;border:1px solid transparent;background:none}
.gr.on{background:var(--s2);border-color:var(--ln)}.gr b{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#0a0f18}.gr em{font-style:normal;font-size:11px;background:var(--fg);color:var(--bg);border-radius:99px;padding:1px 7px;margin-inline-start:6px}
.bar{height:4px;border-radius:4px;background:var(--s2);display:block}.bar u{display:block;height:100%;border-radius:4px;background:var(--c)}
.al{padding:9px 12px;border-radius:12px;margin-bottom:6px;background:color-mix(in srgb,var(--c) 14%,transparent);border-inline-start:3px solid var(--c);width:100%;text-align:start;border-top:0;border-bottom:0;border-inline-end:0;font-size:13px}
.env{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin:10px 0}.env div{background:var(--s2);border-radius:10px;padding:6px 8px}.env b{display:block;font:600 16px "Bricolage Grotesque",Geist}
.log{max-height:150px;overflow:auto;font-size:12.5px}.log div{padding:3px 0;border-bottom:1px solid var(--ln)}.log time{color:var(--mu);margin-inline-end:8px;font-family:ui-monospace,monospace;direction:ltr;display:inline-block}
footer{padding:4px 20px 20px;color:var(--mu);font:11px ui-monospace,monospace;direction:ltr}
.ground{fill:var(--g1)}.ring{fill:none;stroke:var(--ln)}.wall{fill:var(--g2)}.sec{stroke:var(--bg);stroke-width:1}.pit{fill:var(--pit)}.pl{fill:none;stroke:#fff9;stroke-width:1}.roof{fill:none;stroke:var(--mu);stroke-opacity:.45}.sz{fill:#7ea6ff22;stroke:#7ea6ff;stroke-dasharray:4 4}
.route{fill:none;stroke:var(--ok);stroke-width:2.5;stroke-dasharray:8 7;animation:d 1.2s linear infinite}.route.em{stroke:var(--cr)}.route.wn{stroke:var(--wn);opacity:.7}@keyframes d{to{stroke-dashoffset:-30}}
.pin{cursor:pointer}.pin text{font:700 13px Geist;text-anchor:middle;fill:#0a0f18}.pin .l{fill:var(--fg);font-weight:600;font-size:11px}.pu{animation:p 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes p{to{transform:scale(3);opacity:0}}
@media(prefers-reduced-motion:reduce){.route,.pu{animation:none}}
@media(max-width:900px){.grid{grid-template-columns:1fr}.stage{height:62vh;margin:0 8px}.hud{max-width:none;gap:12px}.st b{font-size:20px}.sel{inset:auto 10px 56px 10px;width:auto;padding:10px}[dir=rtl] .sel{inset:auto 10px 56px 10px}.cam{inset:auto 10px 10px auto}.hud{inset:10px 10px auto 10px}.top{padding:10px 12px}.gr{grid-template-columns:30px 1fr 56px 56px}.gr .bar{display:none}}

.stage{height:clamp(480px,84vh,860px);background:#9bbf9a;margin:0 10px}#map{position:absolute;inset:0}
.hud{background:color-mix(in srgb,var(--s1) 92%,transparent);padding:8px 16px;border-radius:16px;border:1px solid var(--ln);max-width:none;gap:20px}
.sel{inset:auto auto 64px 14px;width:270px}[dir=rtl] .sel{inset:auto 14px 64px auto}
.lay{position:absolute;inset:14px 14px auto auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:330px}[dir=rtl] .lay{inset:14px auto auto 14px}
.lay .btn,.dock .btn{background:color-mix(in srgb,var(--s1) 92%,transparent);}.lay .btn.on,.dock .btn.on{background:var(--fg);color:var(--bg)}
.dock{position:absolute;inset:auto 0 14px 0;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;pointer-events:none}.dock>*{pointer-events:auto}
.fa{position:absolute;inset:auto 14px 64px auto;display:flex;flex-direction:column;gap:6px;align-items:flex-end;max-width:340px}[dir=rtl] .fa{inset:auto auto 64px 14px;align-items:flex-start}
.fa .al{background:color-mix(in srgb,var(--s1) 94%,var(--c) 15%)}.fa .btn.cr{background:color-mix(in srgb,var(--s1) 94%,transparent)}.fa .btn.cr.on{background:var(--cr)}
.tl{position:absolute;inset:14px auto auto 50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:16px;border:1px solid var(--ln);background:color-mix(in srgb,var(--s1) 92%,transparent);font-size:12px}.tl #tlc{min-width:120px;font-variant-numeric:tabular-nums;font-weight:600}.tl input{width:min(260px,22vw)}.tl .btn{padding:3px 9px}.tl .btn.on{background:var(--fg);color:var(--bg)}.ch{position:absolute;inset:84px auto auto 14px;width:340px;padding:10px;border-radius:16px;border:1px solid var(--ln);background:color-mix(in srgb,var(--s1) 95%,transparent);font-size:12px;display:flex;flex-direction:column;gap:7px}.ch[hidden]{display:none}[dir=rtl] .ch{inset:84px 14px auto auto}.ch canvas{width:100%;height:auto}.chh{display:flex;justify-content:space-between;align-items:center}.rp,.cp{display:flex;gap:6px;align-items:center}.rp input{flex:1}.ch .btn{padding:3px 9px}.ch table{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}.ch td,.ch th{padding:2px 4px;text-align:end;border-top:1px solid var(--ln)}.ch td:first-child,.ch th:first-child{text-align:start}@media(max-width:900px){.ch{inset:84px 10px auto 10px;width:auto}}
@media(max-width:900px){.tl{inset:auto 10px 100px 10px;transform:none;justify-content:center}.tl input{width:34vw}}
@media(max-width:900px){.stage{height:78vh}.sel{inset:auto 10px 100px 10px;width:auto}[dir=rtl] .sel{inset:auto 10px 100px 10px}.lay{inset:auto 10px 54px 10px;justify-content:center;max-width:none}.fa{display:none}.hud{gap:12px;padding:6px 10px}}
.mk{width:64px;height:64px;border-radius:14px;object-fit:cover;background:#fff;border:1px solid var(--ln);display:block}</style></head><body>

const html=`<!doctype html><html lang="${lang}" dir="${ar?'rtl':'ltr'}"><meta charset="utf-8"><title>AXN ${L2('Match report|تقرير المباراة')}</title><style>${css}</style><body><header><img src="${$('.mk').src}"><div><h1>${L2('Hussain Stadium — Match Report|ملعب الحسين — تقرير المباراة')}</h1><div class="m">${new Date().toLocaleString(ar?'ar-JO':'en-GB')} · ${n} s · ${REC[0].v.m}′ → ${last.v.m}′ · ${L2('Synthetic data|بيانات تجريبية')}</div></div><button class="b" style="margin-inline-start:auto" onclick="print()">⎙ ${L2('Print / PDF|طباعة / PDF')}</button></header>
<h2>${L2('Key figures|المؤشرات الرئيسية')}</h2><div class="g">${K(pkO.toLocaleString(),'Peak attendance|ذروة الحضور')}${K(Math.round(pkO/last.v.cap*100)+'%','Peak occupancy|ذروة الإشغال')}${K(pkP+'%','Peak parking|ذروة المواقف')}${K(L2('Gate|بوابة')+' '+hot+' · '+st[hot].pk,'Hottest gate (per min)|أكثر بوابة ازدحاماً (بالدقيقة)')}${K(hvT+' s','Heavy gate-seconds|ثواني ازدحام البوابات')}${K(al.size,'Distinct alerts|تنبيهات مختلفة')}${K(INLOG.length+' · '+f1(rt)+'s','Incidents · avg response|الحوادث · متوسط الاستجابة')}${K(f1(eta)+' '+t('min'),'Avg exit time|متوسط زمن الخروج')}</div>
<h2>${L2('Gates|البوابات')}</h2><table><tr><th>${L2('Gate|البوابة')}</th><th>${L2('Avg /min|المتوسط /د')}</th><th>${L2('Peak /min|الذروة /د')}</th><th>${L2('Heavy time|وقت الازدحام')}</th></tr>${G.map(g=>row([g,f1(st[g].s/n),st[g].pk,(st[g].hv/n*100).toFixed(0)+'%'])).join('')}</table>
